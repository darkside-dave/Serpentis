name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and build (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swiftc --version

      - name: Run tests
        run: bash app/Tests/run.sh

      - name: Build for macOS 13 and later
        run: |
          mkdir -p .build
          swiftc -O -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            app/Sources/*.swift -o .build/Serpentis
